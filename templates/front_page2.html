<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Translator 🌐</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f8fa;
            padding: 30px;
        }
        h1 {
            color: #333;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 50%;
            margin: auto;
        }
        select, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            background: #e9f7ef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GPT-OSS Translator 🔁📝</h1>
        <form method="POST">
            <label for="language">Select the language to translate:</label>
            <select id="language" name="language">
                {% for lang in languages %}
                    <option value="{{ lang }}">{{ lang }}</option>
                {% endfor %}
            </select>

            <label for="text">Enter the text to translate:</label>
            <textarea id="text" name="text" rows="4" placeholder="Type your text here..."></textarea>

            <button type="submit">Translate</button>
        </form>

        {% if final_text %}
            <div class="result">
                <strong>Output:</strong>
                <p>{{ final_text }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
